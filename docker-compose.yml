services:
  postgres:
    image: postgres:16-alpine
    container_name: bashkir_pg
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-secret}
      POSTGRES_DB: ${PG_DB:-bashkir_school}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bashkir_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bashkir_backend
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${PG_USER:-postgres}:${PG_PASSWORD:-secret}@postgres:5432/${PG_DB:-bashkir_school}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_MODE: ${BOT_MODE:-polling}
      JWT_SECRET: ${JWT_SECRET:-bashkir-school-hackathon-jwt-secret-2026}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pg_data:
